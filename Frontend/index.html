<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>3D House Viewer</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>

    <div id="ui-container">                                                                                                                               
        <h3 style="margin-top: 0;">Upload Floor Plan</h3>                                                                                                   
        <input type="file" id="imageInput" accept="image/*">                                                                                                
        <button onclick="uploadImage()">Generate 3D World</button>                                                                                          
        <p id="statusText">Waiting for upload...</p>                                                                                                        
    </div>   
    
    <a-scene id="vr-scene" style="visibility: hidden;">                                                                                                                                             
        <a-assets>                                                                                                                                          
        <!-- This starts empty. JavaScript will fill it with the .glb later -->                                                                           
        <a-asset-item id="house" src=""></a-asset-item>                                                                                                   
        </a-assets>                                                                                                                                         
                                                                                                                                                            
        <!-- The entity where the house model will spawn -->                                                                                                
        <a-entity id="house-entity" gltf-model="#house"></a-entity>                                                                                         
                                                                                                                                                            
        <!-- Player Camera (You can walk around with W, A, S, D) -->                                                                                        
        <a-entity position="20 1.6 -15">                                                                                                                    
        <a-camera look-controls="pointerLockEnabled: true" wasd-controls="acceleration: 30"></a-camera>                                                   
        </a-entity>                                                                                                                                         
                                                                                                                                                            
        <!-- Basic environment lighting so we can see the house clearly -->                                                                                 
        <a-sky color="#ECECEC"></a-sky>                                                                                                                     
    </a-scene> 

    <script src="scripts/script.js"></script>
    

</body>
</html>
